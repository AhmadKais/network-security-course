<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Segoe UI, Arial, Helvetica, sans-serif" xml:space="preserve" style="white-space:pre">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs>
<rect x="1" y="1" width="898" height="378" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="450.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#0F172A" dominant-baseline="middle">Device hardening - layers of protection for a router</text>
<rect x="60" y="80" width="780" height="40" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
<text x="80" y="100" font-size="15" text-anchor="start" font-weight="700" fill="#334155" dominant-baseline="middle">Physical</text>
<text x="820" y="100" font-size="13" text-anchor="end" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">locked room, console password</text>
<rect x="78" y="127" width="744" height="40" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="98" y="147" font-size="15" text-anchor="start" font-weight="700" fill="#1D4ED8" dominant-baseline="middle">Passwords</text>
<text x="802" y="147" font-size="13" text-anchor="end" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">enable secret, min-length, service password-encryption</text>
<rect x="96" y="174" width="708" height="40" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="116" y="194" font-size="15" text-anchor="start" font-weight="700" fill="#047857" dominant-baseline="middle">Remote access</text>
<text x="784" y="194" font-size="13" text-anchor="end" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">SSH only, ACL on vty, exec-timeout</text>
<rect x="114" y="221" width="672" height="40" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="134" y="241" font-size="15" text-anchor="start" font-weight="700" fill="#B45309" dominant-baseline="middle">Login protection</text>
<text x="766" y="241" font-size="13" text-anchor="end" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">login block-for, banner motd</text>
<rect x="132" y="268" width="636" height="40" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="152" y="288" font-size="15" text-anchor="start" font-weight="700" fill="#6D28D9" dominant-baseline="middle">Monitoring</text>
<text x="748" y="288" font-size="13" text-anchor="end" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">Syslog + NTP + SNMPv3</text>
<rect x="150" y="315" width="600" height="40" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
<text x="170" y="335" font-size="15" text-anchor="start" font-weight="700" fill="#B91C1C" dominant-baseline="middle">Services</text>
<text x="730" y="335" font-size="13" text-anchor="end" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">disable unused (CDP, HTTP), AutoSecure</text>
</svg>
