<text x="668" y="360" font-size="12.5" text-anchor="start" font-weight="400" fill="#64748B" dominant-baseline="middle">When B replies, BBBB is</text>
<text x="668" y="378" font-size="12.5" text-anchor="start" font-weight="400" fill="#64748B" dominant-baseline="middle">learned too -&gt; no more flood</text>
<text x="450" y="445" font-size="13.5" text-anchor="middle" font-weight="400" fill="#64748B" dominant-baseline="middle">Learn the SOURCE  -&gt;  forward by the DESTINATION  -&gt;  unknown = flood  -&gt;  forget after 300 s</text>
