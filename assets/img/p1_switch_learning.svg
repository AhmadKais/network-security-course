<text x="668" y="250" font-size="12.5" text-anchor="start" font-weight="700" fill="#0F172A" dominant-baseline="middle">A sends to B: switch LEARNS</text>
<text x="668" y="270" font-size="12.5" text-anchor="start" font-weight="400" fill="#0F172A" dominant-baseline="middle">source AAAA on port Fa0/1</text>
