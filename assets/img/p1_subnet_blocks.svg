<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Arial, Helvetica, sans-serif" xml:space="preserve" style="white-space:pre">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs>
<rect x="1" y="1" width="898" height="398" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="450.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#0F172A" dominant-baseline="middle">Subnetting: one /24 becomes four /26</text>
<text x="450" y="80" font-size="14.5" text-anchor="middle" font-weight="400" fill="#64748B" dominant-baseline="middle">Split 192.168.10.0/24 into 4 equal subnets -&gt; borrow 2 bits -&gt; /26 -&gt; block size 64</text>
<rect x="50" y="110" width="196" height="120" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="148.0" y="132" font-size="15" text-anchor="middle" font-weight="700" fill="#1D4ED8" dominant-baseline="middle">Subnet 1</text>
<text x="148.0" y="158" font-size="18" text-anchor="middle" font-weight="700" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">.0/26</text>
<text x="148.0" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">hosts .1 - .62</text>
<text x="148.0" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#B91C1C" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">broadcast .63</text>
<text x="50" y="250" font-size="13" text-anchor="start" font-weight="700" fill="#64748B" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">0</text>
<rect x="250" y="110" width="196" height="120" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="348.0" y="132" font-size="15" text-anchor="middle" font-weight="700" fill="#047857" dominant-baseline="middle">Subnet 2</text>
<text x="348.0" y="158" font-size="18" text-anchor="middle" font-weight="700" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">.64/26</text>
<text x="348.0" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">hosts .65 - .126</text>
<text x="348.0" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#B91C1C" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">broadcast .127</text>
<text x="250" y="250" font-size="13" text-anchor="start" font-weight="700" fill="#64748B" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">64</text>
<rect x="450" y="110" width="196" height="120" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="548.0" y="132" font-size="15" text-anchor="middle" font-weight="700" fill="#B45309" dominant-baseline="middle">Subnet 3</text>
<text x="548.0" y="158" font-size="18" text-anchor="middle" font-weight="700" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">.128/26</text>
<text x="548.0" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">hosts .129 - .190</text>
<text x="548.0" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#B91C1C" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">broadcast .191</text>
<text x="450" y="250" font-size="13" text-anchor="start" font-weight="700" fill="#64748B" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">128</text>
<rect x="650" y="110" width="196" height="120" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="748.0" y="132" font-size="15" text-anchor="middle" font-weight="700" fill="#6D28D9" dominant-baseline="middle">Subnet 4</text>
<text x="748.0" y="158" font-size="18" text-anchor="middle" font-weight="700" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">.192/26</text>
<text x="748.0" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">hosts .193 - .254</text>
<text x="748.0" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#B91C1C" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">broadcast .255</text>
<text x="650" y="250" font-size="13" text-anchor="start" font-weight="700" fill="#64748B" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">192</text>
<text x="846" y="250" font-size="13" text-anchor="end" font-weight="700" fill="#64748B" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">255</text>
<line x1="50" y1="240" x2="846" y2="240" stroke="#64748B" stroke-width="2"/>
<rect x="50" y="280" width="796" height="95" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
<text x="70" y="302" font-size="14" text-anchor="start" font-weight="700" fill="#0F172A" dominant-baseline="middle">The 4-step method:</text>
<text x="70" y="326" font-size="14" text-anchor="start" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">1) how many subnets / hosts?   2) bits to borrow: 2^n &gt;= 4  -&gt;  n = 2</text>
<text x="70" y="350" font-size="14" text-anchor="start" font-weight="400" fill="#0F172A" font-family="Consolas, 'DejaVu Sans Mono', monospace" dominant-baseline="middle">3) new prefix: /24 + 2 = /26   4) block size: 256 - 192 = 64  -&gt;  0, 64, 128, 192</text>
</svg>
