<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Arial, Helvetica, sans-serif" xml:space="preserve" style="white-space:pre">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs>
<rect x="1" y="1" width="898" height="398" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="450.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#0F172A" dominant-baseline="middle">IDS/IPS alarm outcomes</text>
<text x="520" y="85" font-size="15" text-anchor="middle" font-weight="700" fill="#64748B" dominant-baseline="middle">Was there a real attack?</text>
<text x="390" y="112" font-size="14" text-anchor="middle" font-weight="700" fill="#0F172A" dominant-baseline="middle">YES (attack)</text>
<text x="650" y="112" font-size="14" text-anchor="middle" font-weight="700" fill="#0F172A" dominant-baseline="middle">NO (normal traffic)</text>
<text x="130" y="190" font-size="15" text-anchor="middle" font-weight="700" fill="#0F172A" dominant-baseline="middle">Alarm</text>
<text x="130" y="210" font-size="15" text-anchor="middle" font-weight="700" fill="#0F172A" dominant-baseline="middle">raised</text>
<text x="130" y="300" font-size="15" text-anchor="middle" font-weight="700" fill="#0F172A" dominant-baseline="middle">No alarm</text>
<rect x="260" y="130" width="250" height="105" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="385" y="170" font-size="17" text-anchor="middle" font-weight="700" fill="#047857" dominant-baseline="middle">True Positive</text>
<text x="385" y="200" font-size="13.5" text-anchor="middle" font-weight="400" fill="#0F172A" dominant-baseline="middle">correct alert</text>
<rect x="520" y="130" width="250" height="105" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="645" y="170" font-size="17" text-anchor="middle" font-weight="700" fill="#B45309" dominant-baseline="middle">False Positive</text>
<text x="645" y="200" font-size="13.5" text-anchor="middle" font-weight="400" fill="#0F172A" dominant-baseline="middle">false alarm - annoying</text>
<rect x="260" y="250" width="250" height="105" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
<text x="385" y="290" font-size="17" text-anchor="middle" font-weight="700" fill="#B91C1C" dominant-baseline="middle">False Negative</text>
<text x="385" y="320" font-size="13.5" text-anchor="middle" font-weight="400" fill="#0F172A" dominant-baseline="middle">MISSED attack - dangerous!</text>
<rect x="520" y="250" width="250" height="105" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="645" y="290" font-size="17" text-anchor="middle" font-weight="700" fill="#047857" dominant-baseline="middle">True Negative</text>
<text x="645" y="320" font-size="13.5" text-anchor="middle" font-weight="400" fill="#0F172A" dominant-baseline="middle">correctly quiet</text>
</svg>
